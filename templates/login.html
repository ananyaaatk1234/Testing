<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Maintenance - Login</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <div class="logo">
                ⚙
            </div>

            <h1>Maintenance</h1>

            <p class="subtitle">
                Machine Management System
            </p>

            <form method="POST" action="{{ url_for('login') }}">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter username"
                    required
                >


                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter password"
                    required
                >


                <label for="role">
                    Login as
                </label>

                <select id="role" name="role">

                    <option value="employee">
                        Employee
                    </option>

                    <option value="manager">
                        Manager
                    </option>

                    <option value="admin">
                        Administrator
                    </option>

                </select>


                <button type="submit">
                    LOGIN
                </button>

            </form>

        </div>

    </div>

</body>
</html>
